name: Build Arcane test ZIP

on:
  push:
    branches:
      - feature/tiny-plates-integration
      - feature/menu-luck-meter-toggles
      - feature/tiny-plates-arcane-theme
    paths:
      - 'Arcane/**'
      - 'tools/package.py'
      - 'dev/arcane/**'
      - '.github/workflows/build-tiny-plates-test.yml'

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Lua and font tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          python -m pip install fonttools
      - name: Check Lua syntax
        run: |
          find Arcane -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          luac5.1 -p dev/arcane/tiny_plates_tests.lua
      - name: Run Arcane mock regression suite
        working-directory: dev
        run: lua5.1 arcane/tiny_plates_tests.lua . ../Arcane
      - name: Validate and package addon
        run: python tools/package.py --output dist/Arcane-Tiny-Plates-Arcane-Style-test.zip
      - name: Upload installable test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Arcane-Tiny-Plates-Arcane-Style-test
          path: dist/Arcane-Tiny-Plates-Arcane-Style-test.zip
          if-no-files-found: error
          retention-days: 7
