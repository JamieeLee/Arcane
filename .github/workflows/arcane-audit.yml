name: Arcane QA and Manual Release

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "feature/**"
      - "release/**"
    tags:
      - "v*"
    paths:
      - "**.lua"
      - "**.toc"
      - "**.md"
      - "Art/**"
      - "Fonts/**"
      - "ATTRIBUTION.txt"
      - "ArcaneNameplates-LICENSE.txt"
      - "tools/**"
      - ".github/workflows/arcane-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.lua"
      - "**.toc"
      - "**.md"
      - "Art/**"
      - "Fonts/**"
      - "ATTRIBUTION.txt"
      - "ArcaneNameplates-LICENSE.txt"
      - "tools/**"
      - ".github/workflows/arcane-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-package:
    name: Audit, compile and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve and validate the addon version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^Arcane.VERSION = "/ { print $2; exit }' Core.lua)"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Core.VERSION $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=ArcaneV$version.zip" >> "$GITHUB_OUTPUT"
          echo "artifact=Arcane-v$version-test-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Install Pillow for the Classic medallion texture build
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 zip unzip

      - name: Generate class-specific Hybrid medallion variants
        run: python tools/build_hybrid_medallion_variants.py

      - name: Build the single-source Classic medallion texture
        run: python tools/build_default_medallion.py

      - name: Audit damage-number module ownership and load order
        run: python tools/audit_numbers.py

      - name: Audit skill-bar style modules and class artwork
        run: python tools/audit_bar_styles.py

      - name: Audit current release metadata consistency
        run: python tools/audit_release_metadata.py

      - name: Audit Arcane Nameplates state and module ownership
        run: python tools/audit_nameplates.py

      - name: Audit native text theming and behavior preservation
        run: python tools/audit_native_text.py

      - name: Audit stock error-frame controls
        run: python tools/audit_stock_frame_controls.py

      - name: Audit unused game keybindings
        run: python tools/audit_unused_keybindings.py

      - name: Audit native FPS display and Ctrl+R synchronization
        run: python tools/audit_framerate.py

      - name: Audit run summary lifecycle
        run: python tools/audit_run_summary.py

      - name: Audit boss skulls and cache marks
        run: python tools/audit_skulls.py

      - name: Audit native Store Level-Ups setting integration
        run: python tools/audit_levelups.py

      - name: Audit Party DPS skill ownership and rank badges
        run: python tools/audit_meter_and_ranks.py

      - name: Audit paired guardian bar layout
        run: python tools/audit_guardian_bars.py

      - name: Audit Party DPS in co-op
        run: python tools/audit_coop_meter.py

      - name: Compile every Lua chunk and enforce local-variable limits
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
          test "$count" -gt 0
          echo "Compiled $count Lua chunks successfully."

      - name: Build installable addon ZIP
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/package"
          addon="$stage/Arcane"
          archive="$RUNNER_TEMP/ArcaneV${VERSION}.zip"

          mkdir -p "$addon"
          while IFS= read -r -d '' file; do
            relative="${file#./}"
            mkdir -p "$addon/$(dirname "$relative")"
            cp "$file" "$addon/$relative"
          done < <(find . -type f \( -name '*.lua' -o -name '*.toc' \) -not -path './.git/*' -print0)
          cp -R Art Fonts "$addon/"
          cp ATTRIBUTION.txt ArcaneNameplates-LICENSE.txt "$addon/"

          cd "$stage"
          zip -qr "$archive" Arcane
          unzip -t "$archive"
          entries="$RUNNER_TEMP/arcane-zip-entries.txt"
          unzip -Z1 "$archive" > "$entries"
          for required in \
            "Arcane/Arcane.toc" \
            "Arcane/Core.lua" \
            "Arcane/Art/Diamond.blp" \
            "Arcane/Fonts/Letters.ttf" \
            "Arcane/Fonts/LettersCJK.ttf" \
            "Arcane/Fonts/LICENSE.txt" \
            "Arcane/Fonts/NumberFonts-LICENSE.txt" \
            "Arcane/ATTRIBUTION.txt" \
            "Arcane/ArcaneNameplates-LICENSE.txt"; do
            grep -Fxq "$required" "$entries" || { echo "Missing package entry: $required"; exit 1; }
          done
          if grep -Evq '^Arcane/' "$entries"; then
            echo "ZIP contains entries outside the Arcane install folder."
            exit 1
          fi
          entry_count="$(wc -l < "$entries" | tr -d ' ')"
          echo "Verified $entry_count archive entries and required multilingual assets."
          sha256sum "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload test ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14


  publish-release:
    name: Publish versioned GitHub Release (manual approval)
    # Never publish on merge, push or a tag event. Explicitly choose Actions >
    # Arcane QA and Manual Release > Run workflow, selecting the main branch.
    # After that click, audit-and-package must still succeed before publication.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: audit-and-package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python for release-note extraction
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Decide whether this commit should publish
        id: release_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^Arcane.VERSION = "/ { print $2; exit }' Core.lua)"
          test -n "$version"
          tag="v${version}"
          test "$GITHUB_REF_NAME" = "main"
          # Do not move an existing version tag to a newer commit. A new tested
          # build needs a new version. An already-tagged exact commit can be
          # explicitly rerun to repair a missing or incomplete release asset.
          if old_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha // empty' 2>/dev/null)"; then
            :
          elif [[ "$old_sha" == *'"status"'* && "$old_sha" == *'404'* ]]; then
            old_sha=""
          else
            echo "Tag lookup failed: $old_sha"
            exit 1
          fi
          if [[ -n "$old_sha" && ! "$old_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected tag lookup value: $old_sha"
            exit 1
          fi
          if [[ -n "$old_sha" && "$old_sha" != "$GITHUB_SHA" ]]; then
            echo "Cannot publish $tag: that tag belongs to commit $old_sha, not this build."
            echo "Bump the release version before clicking Run workflow."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=ArcaneV${version}.zip" >> "$GITHUB_OUTPUT"
          echo "artifact=Arcane-v${version}-test-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Download validated ZIP and extract release notes
        if: steps.release_meta.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          ASSET: ${{ steps.release_meta.outputs.asset }}
          ARTIFACT: ${{ steps.release_meta.outputs.artifact }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT" --dir release-assets
          test -s "release-assets/$ASSET"
          python tools/extract_release_notes.py "$VERSION" "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Tag and publish this validated build
        if: steps.release_meta.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          ASSET: ${{ steps.release_meta.outputs.asset }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          asset="$ASSET"
          # GITHUB_TOKEN-created tags do not start another Actions run.
          # Only this manually approved build can create the tag and release.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            if old_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha // empty' 2>/dev/null)"; then
              :
            elif [[ "$old_sha" == *'"status"'* && "$old_sha" == *'404'* ]]; then
              old_sha=""
            else
              echo "Tag lookup failed: $old_sha"
              exit 1
            fi
            if [[ -n "$old_sha" && ! "$old_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Unexpected tag lookup value: $old_sha"
              exit 1
            fi
            if [[ -z "$old_sha" ]]; then
              gh api -X POST "repos/$GH_REPO/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
            else
              test "$old_sha" = "$GITHUB_SHA"
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Arcane UI $tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$tag" "release-assets/$asset" --clobber
          else
            gh release create "$tag" "release-assets/$asset" \
              --title "Arcane UI $tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
