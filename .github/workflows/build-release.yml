name: Build and release Arcane UI

on:
  pull_request:
    branches: [main, "audit/character-suite-diagnostic"]
    paths:
      - "Arcane/**"
      - "tools/**"
      - "dev/arcane/**"
      - ".github/workflows/build-release.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Test, validate, and package Arcane
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python -m pip install --upgrade pip fonttools
          mkdir -p "$RUNNER_TEMP/lua50"
          curl -fsSL https://www.lua.org/ftp/lua-5.0.3.tar.gz -o "$RUNNER_TEMP/lua-5.0.3.tar.gz"
          echo "1193a61b0e08acaa6eee0eecf29709179ee49c71baebc59b682a25c3b5a45671  $RUNNER_TEMP/lua-5.0.3.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lua-5.0.3.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/lua50"
          make -C "$RUNNER_TEMP/lua50"
          echo "$RUNNER_TEMP/lua50/bin" >> "$GITHUB_PATH"

      - name: Check Lua syntax
        run: |
          lua -e 'print(_VERSION)' | grep -F 'Lua 5.0'
          find Arcane -name '*.lua' -print0 | xargs -0 -n1 luac -p
          luac -p dev/arcane/tiny_plates_tests.lua
          luac -p dev/arcane/mock_arcane.lua
          luac -p dev/arcane/loot_tests.lua
          luac -p dev/arcane/tests.lua

      - name: Run full Arcane behavior suite
        working-directory: dev
        run: lua arcane/tests.lua . ../Arcane

      - name: Run focused Tiny Plates regression tests
        working-directory: dev
        run: lua arcane/tiny_plates_tests.lua . ../Arcane

      - name: Run focused Arcane loot tests
        working-directory: dev
        run: lua arcane/loot_tests.lua . ../Arcane

      - name: Check translations
        run: python dev/arcane/locale_check.py Arcane

      - name: Validate and build installable ZIP
        run: python tools/package.py

      - name: Upload build artifact
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Arcane-${{ github.run_number }}-test
          path: dist/Arcane-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Arcane-*.zip
